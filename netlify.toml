[build]
  publish = "."
  command = "node scripts/build-content.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/uploads/*"
  to = "/public/uploads/:splat"
  status = 200

[[headers]]
  for = "/content/bundle.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
